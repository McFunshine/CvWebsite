<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Paul Spencer - Senior Software Engineer & AI Architect with ~30 years experience{% endblock %}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{% block canonical_url %}https://spencerpj.com/{% endblock %}">

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://spencerpj.com/{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Paul Spencer - Software Engineer & AI Architect{% endblock %}">
    <meta property="og:description" content="{% block og_description %}30+ years of software engineering excellence across AI/ML, Java, .NET and more{% endblock %}">
    <meta property="og:image" content="https://spencerpj.com/static/img/photogravure.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://spencerpj.com/static/img/photogravure.png">

    <link rel="shortcut icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v=2">
    <link rel="icon" type="image/png" href="/static/img/favicon.png?v=2">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Paul Spencer",
        "url": "https://spencerpj.com",
        "image": "https://spencerpj.com/static/img/photogravure.png",
        "jobTitle": "Senior Software Engineer & AI Architect",
        "description": "Senior Software Engineer with 30+ years experience across AI/ML, Java, .NET, Kotlin and Python",
        "email": "mailto:spencerpj@gmail.com",
        "sameAs": [
            "https://www.linkedin.com/in/paul-spencer-4789085/",
            "https://github.com/McFunshine/"
        ],
        "knowsAbout": ["AI/ML", "Java", "Kotlin", ".NET", "Python", "LLM Fine-tuning", "Software Architecture"],
        "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "University of Amsterdam"
        },
        "hasCredential": {
            "@type": "EducationalOccupationalCredential",
            "credentialCategory": "degree",
            "name": "Master's in Software Engineering"
        }
    }
    </script>
</head>
<body>
    <!-- SVG Definitions (boxicons) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="icon-email" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.103 0-2 .897-2 2v12c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zm0 2v.511l-8 6.223-8-6.222V6h16zM4 18V9.044l7.386 5.745a.994.994 0 0 0 1.228 0L20 9.044 20.002 18H4z"/>
        </symbol>
        <symbol id="icon-linkedin" viewBox="0 0 24 24">
            <circle cx="4.983" cy="5.009" r="2.188"/>
            <path d="M9.237 8.855v12.139h3.769v-6.003c0-1.584.298-3.118 2.262-3.118 1.937 0 1.961 1.811 1.961 3.218v5.904H21v-6.657c0-3.27-.704-5.783-4.526-5.783-1.835 0-3.065 1.007-3.568 1.96h-.051v-1.66H9.237zm-6.142 0H6.87v12.139H3.095z"/>
        </symbol>
        <symbol id="icon-github" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12.026 2c-5.509 0-9.974 4.465-9.974 9.974 0 4.406 2.857 8.145 6.821 9.465.499.09.679-.217.679-.481 0-.237-.008-.865-.011-1.696-2.775.602-3.361-1.338-3.361-1.338-.452-1.152-1.107-1.459-1.107-1.459-.905-.619.069-.605.069-.605 1.002.07 1.527 1.028 1.527 1.028.89 1.524 2.336 1.084 2.902.829.091-.645.351-1.085.635-1.334-2.214-.251-4.542-1.107-4.542-4.93 0-1.087.389-1.979 1.024-2.675-.101-.253-.446-1.268.099-2.64 0 0 .837-.269 2.742 1.021a9.582 9.582 0 0 1 2.496-.336 9.554 9.554 0 0 1 2.496.336c1.906-1.291 2.742-1.021 2.742-1.021.545 1.372.203 2.387.099 2.64.64.696 1.024 1.587 1.024 2.675 0 3.833-2.33 4.675-4.552 4.922.355.308.675.916.675 1.846 0 1.334-.012 2.41-.012 2.737 0 .267.178.577.687.479C19.146 20.115 22 16.379 22 11.974 22 6.465 17.535 2 12.026 2z"/>
        </symbol>
    </svg>

    <nav class="nav" aria-label="Main navigation">
        <div class="nav-inner">
            <div class="nav-social">
                <a href="mailto:spencerpj@gmail.com" aria-label="Email">
                    <svg viewBox="0 0 24 24"><use href="#icon-email"></use></svg>
                </a>
                <a href="https://www.linkedin.com/in/paul-spencer-4789085/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24"><use href="#icon-linkedin"></use></svg>
                </a>
                <a href="https://github.com/McFunshine/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg viewBox="0 0 24 24"><use href="#icon-github"></use></svg>
                </a>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <div class="nav-dropdown">
                    <button class="nav-link nav-dropdown-toggle">Projects</button>
                    <div class="nav-dropdown-menu">
                        <a href="/projects/klinkendetaal.html">Klinkende Taal</a>
                        <a href="/projects/podmorph.html">Podmorph</a>
                        <a href="/projects/vvz-app.html">VVZ App</a>
                        <a href="/projects/khonraad.html">Khonraad</a>
                        <a href="/projects/jewelsuite.html">JewelSuite</a>
                        <a href="/projects/language-engineering.html">Language Engineering</a>
                    </div>
                </div>
                <a href="/cvs.html" class="nav-link">CV</a>
                <a href="/about.html" class="nav-link">About Me</a>
            </div>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- Email Fallback Modal -->
    <div class="email-fallback" id="emailFallback">
        <p>You don't have a mail program associated with this browser, so here is my email address:</p>
        <p><strong>spencerpj@gmail.com</strong></p>
        <button onclick="document.getElementById('emailFallback').classList.remove('show')">Close</button>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
