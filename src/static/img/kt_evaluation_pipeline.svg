<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Model Evaluation Pipeline</text>

  <!-- Test Cases Box -->
  <rect x="30" y="70" width="120" height="260" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="90" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">29 Test Cases</text>
  <text x="90" y="120" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Payment reminders</text>
  <text x="90" y="138" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Damage claims</text>
  <text x="90" y="156" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Renovation notices</text>
  <text x="90" y="174" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">...</text>

  <!-- Arrow 1 -->
  <path d="M155 200 L185 200" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/></marker></defs>

  <!-- Providers Box -->
  <rect x="190" y="70" width="140" height="260" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="260" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">4 Providers</text>
  <text x="260" y="125" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">Mistral</text>
  <text x="260" y="150" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">OpenAI</text>
  <text x="260" y="175" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">Groq</text>
  <text x="260" y="200" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">Nebius</text>
  <text x="260" y="235" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">36 Models</text>
  <text x="260" y="255" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">GPT, Mistral, Llama</text>
  <text x="260" y="273" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Qwen, DeepSeek...</text>

  <!-- Arrow 2 -->
  <path d="M335 200 L365 200" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Judges Box -->
  <rect x="370" y="70" width="160" height="260" rx="8" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="450" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Evaluation Layer</text>
  <text x="450" y="125" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">KT API (B1 Scoring)</text>
  <line x1="390" y1="140" x2="510" y2="140" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="450" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">4 LLM Judges</text>
  <text x="450" y="185" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Data Correctness</text>
  <text x="450" y="205" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Style Compliance</text>
  <text x="450" y="225" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Quality Adherence</text>
  <text x="450" y="245" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Content Rules</text>
  <line x1="390" y1="260" x2="510" y2="260" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Human Review</text>

  <!-- Arrow 3 -->
  <path d="M535 200 L565 200" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Results Box -->
  <rect x="570" y="70" width="200" height="260" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="670" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Results</text>
  <text x="670" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Winner: Mistral-Small-24B</text>
  <text x="670" y="165" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">Baseline: 12.4% B1</text>
  <text x="670" y="190" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11">After DPO: 75.6% B1</text>
  <rect x="600" y="210" width="140" height="40" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="670" y="235" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">+63.1%</text>
  <text x="670" y="280" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">improvement in B1 compliance</text>

  <!-- Footer -->
  <text x="400" y="370" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11">Java/Spring Boot + Kotlin evaluation platform with PostgreSQL backend</text>
</svg>
